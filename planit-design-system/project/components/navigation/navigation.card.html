<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .grid { display: flex; flex-direction: column; gap: 22px; max-width: 460px; }
  .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 10px; }
  .frame { border: 1px solid var(--border-secondary); border-radius: var(--radius-xl); overflow: hidden; background: var(--surface-card); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { TopBar, TabBar, BottomCTA, Icon } = window.PlanitDesignSystem_e6392f;
function Demo(){
  const [tab,setTab]=React.useState("list");
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  return (
    <div className="grid">
      <div>
        <div className="lbl">TopBar</div>
        <div className="frame">
          <TopBar title="제주 워크샵" onBack={()=>{}} trailing={<span style={{display:"grid",placeItems:"center",width:40,height:40,color:"var(--text-primary)"}}><Icon name="share-2"/></span>} />
          <div style={{height:1}}/>
          <TopBar title="플랜잇" leading={<img src="../../assets/logo-blue.png" style={{width:28,height:28,objectFit:"contain",marginLeft:8}}/>} trailing={<span style={{display:"grid",placeItems:"center",width:40,height:40,color:"var(--text-primary)"}}><Icon name="bell"/></span>} />
        </div>
      </div>
      <div>
        <div className="lbl">TabBar (floating)</div>
        <div style={{padding:"16px", background:"var(--surface-sunken)", borderRadius:"var(--radius-xl)"}}>
          <TabBar value={tab} onChange={setTab} items={[
            {value:"home",label:"홈",icon:"home"},
            {value:"list",label:"일정",icon:"calendar"},
            {value:"stats",label:"통계",icon:"bar-chart-3"},
            {value:"me",label:"내 정보",icon:"user"},
          ]}/>
        </div>
      </div>
      <div>
        <div className="lbl">BottomCTA</div>
        <div className="frame" style={{position:"relative", height:150}}>
          <div style={{padding:16, color:"var(--text-tertiary)", font:"var(--body-2-fw) var(--body-2-size) var(--font-sans)"}}>스크롤되는 일정 내용…</div>
          <BottomCTA info="로그인 없이 공유해요" onClick={()=>{}}>공유 링크 만들기</BottomCTA>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
