<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .wrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; max-width: 640px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 2px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Card, ListRow, Chip, Badge, Avatar, Icon } = window.PlanitDesignSystem_e6392f;
function Demo(){
  const [sel,setSel]=React.useState(true);
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  return (
    <div className="wrap">
      <div className="col" style={{flex:1, minWidth:300}}>
        <div className="lbl">ListRow (in a Card)</div>
        <Card padding={0} style={{overflow:"hidden"}}>
          <ListRow left={<Avatar name="제주 워크샵" />} title="제주 워크샵" subtitle="2박 3일 · 12명"
            right={<Badge tone="success" dot>공개중</Badge>} chevron onClick={()=>{}} />
          <div style={{height:1, background:"var(--border-secondary)", marginLeft:24}} />
          <ListRow left={<Avatar name="가을 MT" tone="neutral" />} title="가을 동아리 MT" subtitle="1박 2일 · 24명"
            right={<span className="tnum" style={{font:"var(--label-m-fw) var(--label-m-size) var(--font-sans)", color:"var(--text-brand)"}}>조회 128</span>} chevron onClick={()=>{}} />
          <div style={{height:1, background:"var(--border-secondary)", marginLeft:24}} />
          <ListRow left={<Avatar name="비공개" tone="neutral" />} title="사내 오프사이트" subtitle="비공개 링크"
            right={<Badge tone="neutral">비공개</Badge>} chevron onClick={()=>{}} />
        </Card>
      </div>
      <div className="col" style={{flex:1, minWidth:260}}>
        <div className="lbl">Chip</div>
        <div className="row">
          <Chip active={sel} onClick={()=>setSel(!sel)}>전체</Chip>
          <Chip>맛집</Chip>
          <Chip>숙소</Chip>
          <Chip variant="brand" leadingIcon={<Icon name="sparkles" size={14}/>}>추천</Chip>
        </div>
        <div className="lbl" style={{marginTop:8}}>Badge</div>
        <div className="row">
          <Badge tone="brand">NEW</Badge>
          <Badge tone="success" dot>공개중</Badge>
          <Badge tone="danger">비공개</Badge>
          <Badge tone="warning" dot>임시저장</Badge>
          <Badge tone="info">미리보기</Badge>
        </div>
        <div className="lbl" style={{marginTop:8}}>Avatar</div>
        <div className="row">
          <Avatar name="김플랜" />
          <Avatar name="이여행" shape="circle" tone="neutral" />
          <Avatar name="P" size={32} />
        </div>
        <div className="lbl" style={{marginTop:8}}>Icon (Lucide)</div>
        <div className="row" style={{color:"var(--text-secondary)"}}>
          <Icon name="calendar"/><Icon name="map-pin"/><Icon name="clock"/>
          <Icon name="share-2"/><Icon name="bus"/><Icon name="copy"/>
          <Icon name="bar-chart-3" color="var(--text-brand)"/>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
