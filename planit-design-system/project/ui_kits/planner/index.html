<!-- @startingPoint section="Planner" subtitle="Desktop planner dashboard + drag-drop editor + share manager" viewport="1280x760" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>플랜잇 · 기획자</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html,body { margin:0; height:100%; background: var(--surface-page); font-family: var(--font-sans); }
  #root { height: 100vh; }
  .app { display: flex; height: 100%; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="PlannerScreens.jsx"></script>
<script type="text/babel">
const { Toast } = window.PlanitDesignSystem_e6392f;
function App(){
  const { Sidebar, Dashboard, Editor, ShareManager } = window.PlanitPlanner;
  const [view,setView]=React.useState("dash");
  const [toast,setToast]=React.useState(null);
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  const showToast=(m)=>{ setToast(m); clearTimeout(window.__t); window.__t=setTimeout(()=>setToast(null),1800); };
  return (
    <div className="app">
      <Sidebar view={view} setView={setView}/>
      <div className="main">
        {view==="dash" && <Dashboard onOpen={()=>setView("editor")} onNew={()=>setView("editor")}/>}
        {view==="editor" && <Editor onShare={()=>setView("share")} onToast={showToast}/>}
        {view==="share" && <ShareManager onToast={showToast}/>}
      </div>
      {toast && <Toast tone="success" floating>{toast}</Toast>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
