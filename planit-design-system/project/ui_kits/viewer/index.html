<!-- @dsCard group="Viewer" viewport="430x740" name="Viewer · 모바일 일정 페이지" subtitle="로그인 없는 뷰어 — 타임테이블·하이라이트·장소·지도 액션" -->
<!-- @startingPoint section="Viewer" subtitle="Login-free mobile schedule viewer with map actions" viewport="430x740" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>플랜잇 · 뷰어</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); display: grid; place-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
  .phone { width: 390px; max-width: 100%; height: 720px; background: var(--surface-card); border-radius: 40px; border: 1px solid var(--border-secondary); box-shadow: var(--shadow-3); overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow-y: auto; }
  .scroll::-webkit-scrollbar { width: 0; }
  .seg-wrap { position: sticky; top: 0; z-index: 5; background: var(--surface-card); padding: 12px 24px; border-bottom: 1px solid var(--border-secondary); display: flex; justify-content: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ViewerScreens.jsx"></script>
<script type="text/babel">
const { TopBar, Button, SegmentedControl, Toast, Icon } = window.PlanitDesignSystem_e6392f;
function App(){
  const { Cover, Timetable, Highlights, Places, PlaceSheet, StatusScreen } = window.PlanitViewer;
  const [tab,setTab]=React.useState("타임테이블");
  const [place,setPlace]=React.useState(null);
  const [toast,setToast]=React.useState(null);
  const [broken,setBroken]=React.useState(false);
  React.useEffect(()=>{ if(window.lucide) window.lucide.createIcons(); });
  const showToast=(m)=>{ setToast(m); clearTimeout(window.__t); window.__t=setTimeout(()=>setToast(null),1800); };

  if(broken) return (
    <div className="phone">
      <TopBar title="플랜잇" centered border />
      <div className="scroll"><StatusScreen onBack={()=>setBroken(false)} /></div>
    </div>
  );

  return (
    <div className="phone">
      <TopBar title="제주 워크샵 2026" border
        trailing={<button onClick={()=>setBroken(true)} title="상태 화면 보기" style={{display:"grid",placeItems:"center",width:40,height:40,border:"none",background:"transparent",cursor:"pointer",color:"var(--text-primary)"}}><Icon name="share-2" size={22}/></button>} />
      <div className="scroll">
        <Cover/>
        <div className="seg-wrap">
          <SegmentedControl options={["타임테이블","하이라이트","장소"]} value={tab} onChange={setTab}/>
        </div>
        {tab==="타임테이블" && <Timetable onPlace={setPlace}/>}
        {tab==="하이라이트" && <Highlights/>}
        {tab==="장소" && <Places onPlace={setPlace}/>}
        <div style={{height:96}}/>
      </div>
      <div style={{position:"absolute",left:0,right:0,bottom:0}}>
        <div style={{position:"relative"}}>
          <div style={{position:"absolute",top:-28,left:0,right:0,height:28,background:"linear-gradient(to bottom, rgba(255,255,255,0), var(--surface-card))",pointerEvents:"none"}}/>
          <div style={{background:"var(--surface-card)",padding:"12px 16px 18px",display:"flex",gap:8}}>
            <Button variant="secondary" size="xl" onClick={()=>showToast("링크를 복사했어요")} style={{flex:"0 0 auto",width:56,padding:0}}><Icon name="copy" size={22}/></Button>
            <Button variant="primary" size="xl" block onClick={()=>showToast("공유 시트를 열었어요")}>이 일정 공유하기</Button>
          </div>
        </div>
      </div>
      <PlaceSheet placeKey={place} onClose={()=>setPlace(null)} onToast={showToast}/>
      {toast && <Toast tone="success" floating>{toast}</Toast>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
