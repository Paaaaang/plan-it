<!-- @dsCard group="Brand" viewport="700x200" name="Symbol logo" subtitle="Temporary mark — black / blue / on-dark" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:24px;background:var(--surface-card);font-family:var(--font-sans);}
  .row{display:flex;gap:16px;align-items:stretch;}
  .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:var(--radius-xl);padding:24px;border:1px solid var(--border-secondary);}
  .c img{width:96px;height:96px;object-fit:contain;}
  .lbl{font:500 11px/1 var(--font-sans);color:var(--text-tertiary);}
  .lock{display:flex;align-items:center;gap:12px;}
  .word{font:700 26px/1 var(--font-sans);letter-spacing:-.02em;color:var(--text-primary);}
</style></head>
<body>
<div class="row">
  <div class="c"><img src="../assets/logo-black-trim.png"/><span class="lbl">Black · #17171F</span></div>
  <div class="c"><img src="../assets/logo-blue.png"/><span class="lbl">Blue · #3182F6</span></div>
  <div class="c" style="background:var(--grey-900);border-color:var(--grey-900)"><img src="../assets/logo-white.png"/><span class="lbl" style="color:var(--grey-300)">On dark</span></div>
  <div class="c" style="align-items:flex-start;justify-content:center;">
    <span class="lbl">Wordmark lockup</span>
    <div class="lock"><img src="../assets/logo-blue.png" style="width:40px;height:40px;"/><span class="word">플랜잇</span></div>
  </div>
</div>
</body></html>
