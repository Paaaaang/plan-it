<!-- @dsCard group="Colors" viewport="700x150" name="Brand · Planit Blue" subtitle="Single-accent scale; 500 is the canonical CTA color" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);}
  .row{display:flex;gap:8px;}
  .sw{flex:1;height:88px;border-radius:var(--radius-m);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;border:1px solid var(--border-subtle);}
  .n{font:700 12px/1.2 var(--font-sans);}
  .h{font:500 10px/1.4 var(--font-sans);opacity:.8;}
  .dark{color:#fff;} .light{color:var(--grey-900);}
</style></head>
<body>
<div class="row">
  <div class="sw light" style="background:var(--blue-50)"><span class="n">50</span><span class="h">#EBF3FE</span></div>
  <div class="sw light" style="background:var(--blue-100)"><span class="n">100</span><span class="h">#D6E7FD</span></div>
  <div class="sw light" style="background:var(--blue-200)"><span class="n">200</span><span class="h">#ADCBFB</span></div>
  <div class="sw light" style="background:var(--blue-300)"><span class="n">300</span><span class="h">#7FAAF8</span></div>
  <div class="sw dark" style="background:var(--blue-400)"><span class="n">400</span><span class="h">#5296F7</span></div>
  <div class="sw dark" style="background:var(--blue-500);outline:2px solid var(--blue-500);outline-offset:2px"><span class="n">500 ·CTA</span><span class="h">#3182F6</span></div>
  <div class="sw dark" style="background:var(--blue-600)"><span class="n">600</span><span class="h">#1F6FE5</span></div>
  <div class="sw dark" style="background:var(--blue-700)"><span class="n">700</span><span class="h">#1B5FCB</span></div>
  <div class="sw dark" style="background:var(--blue-800)"><span class="n">800</span><span class="h">#17489B</span></div>
  <div class="sw dark" style="background:var(--blue-900)"><span class="n">900</span><span class="h">#12336B</span></div>
</div>
</body></html>
