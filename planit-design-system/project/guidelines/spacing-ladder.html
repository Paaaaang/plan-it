<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing ladder" subtitle="4px base — 4→80, 12 steps" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:24px;background:var(--surface-card);font-family:var(--font-sans);}
  .row{display:flex;align-items:flex-end;gap:14px;}
  .c{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{background:var(--fill-brand);border-radius:3px;width:16px;}
  .n{font:700 11px/1 var(--font-sans);color:var(--text-primary);}
  .u{font:500 10px/1 var(--font-sans);color:var(--text-tertiary);}
</style></head>
<body>
<div class="row">
  <div class="c"><div class="bar" style="height:4px"></div><span class="n">1</span><span class="u">4</span></div>
  <div class="c"><div class="bar" style="height:8px"></div><span class="n">2</span><span class="u">8</span></div>
  <div class="c"><div class="bar" style="height:12px"></div><span class="n">3</span><span class="u">12</span></div>
  <div class="c"><div class="bar" style="height:16px"></div><span class="n">4</span><span class="u">16</span></div>
  <div class="c"><div class="bar" style="height:20px"></div><span class="n">5</span><span class="u">20</span></div>
  <div class="c"><div class="bar" style="height:24px"></div><span class="n">6</span><span class="u">24</span></div>
  <div class="c"><div class="bar" style="height:28px"></div><span class="n">7</span><span class="u">28</span></div>
  <div class="c"><div class="bar" style="height:32px"></div><span class="n">8</span><span class="u">32</span></div>
  <div class="c"><div class="bar" style="height:40px"></div><span class="n">10</span><span class="u">40</span></div>
  <div class="c"><div class="bar" style="height:48px"></div><span class="n">12</span><span class="u">48</span></div>
  <div class="c"><div class="bar" style="height:64px"></div><span class="n">16</span><span class="u">64</span></div>
  <div class="c"><div class="bar" style="height:80px"></div><span class="n">20</span><span class="u">80</span></div>
</div>
</body></html>
