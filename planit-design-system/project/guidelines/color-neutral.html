<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals · Cool grey" subtitle="grey-900 is a soft ink, never pure black" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans);}
  .row{display:flex;gap:6px;}
  .sw{flex:1;height:88px;border-radius:var(--radius-m);display:flex;flex-direction:column;justify-content:flex-end;padding:7px;box-sizing:border-box;border:1px solid var(--border-subtle);}
  .n{font:700 11px/1.2 var(--font-sans);}
  .h{font:500 9px/1.4 var(--font-sans);opacity:.85;}
  .dark{color:#fff;} .light{color:var(--grey-900);}
</style></head>
<body>
<div class="row">
  <div class="sw dark" style="background:var(--grey-900)"><span class="n">900</span><span class="h">#17171F</span></div>
  <div class="sw dark" style="background:var(--grey-800)"><span class="n">800</span></div>
  <div class="sw dark" style="background:var(--grey-700)"><span class="n">700</span></div>
  <div class="sw dark" style="background:var(--grey-600)"><span class="n">600</span></div>
  <div class="sw dark" style="background:var(--grey-500)"><span class="n">500</span></div>
  <div class="sw light" style="background:var(--grey-400)"><span class="n">400</span></div>
  <div class="sw light" style="background:var(--grey-300)"><span class="n">300</span></div>
  <div class="sw light" style="background:var(--grey-200)"><span class="n">200</span><span class="h">divider</span></div>
  <div class="sw light" style="background:var(--grey-100)"><span class="n">100</span></div>
  <div class="sw light" style="background:var(--grey-50)"><span class="n">50</span></div>
</div>
</body></html>
