<!-- @dsCard group="Type" viewport="700x220" name="Titles & Body" subtitle="15px / 1.5 body is the Korean-readability default" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:24px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-primary);}
  .r{display:flex;align-items:baseline;gap:16px;padding:7px 0;border-bottom:1px solid var(--border-secondary);}
  .r:last-child{border:none;}
  .tag{flex:0 0 96px;font:600 11px/1 var(--font-mono,monospace);color:var(--text-tertiary);}
</style></head>
<body>
  <div class="r"><span class="tag">title-1 · 18/600</span><span class="t-title-1">제주 워크샵</span></div>
  <div class="r"><span class="tag">title-2 · 17/600</span><span class="t-title-2">숙소 체크인</span></div>
  <div class="r"><span class="tag">body-1 · 17/400</span><span class="t-body-1">참가자는 로그인 없이 링크만 열면 돼요.</span></div>
  <div class="r"><span class="tag">body-2 · 15/400</span><span class="t-body-2" style="color:var(--text-secondary)">오늘/지금 무엇을 하는지 한눈에 볼 수 있어요.</span></div>
  <div class="r"><span class="tag">body-3 · 13/400</span><span class="t-body-3" style="color:var(--text-tertiary)">변경이 생기면 편집 후 바로 반영돼요.</span></div>
</body></html>
