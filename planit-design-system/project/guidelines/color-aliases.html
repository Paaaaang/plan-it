<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="Call these in product surfaces, not raw steps" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .tok{background:var(--surface-card);border:1px solid var(--border-secondary);border-radius:var(--radius-m);padding:12px;}
  .chip{width:100%;height:34px;border-radius:var(--radius-s);margin-bottom:8px;}
  .k{font:600 11px/1.3 var(--font-mono,monospace);color:var(--text-primary);}
  .v{font:400 10px/1.3 var(--font-sans);color:var(--text-tertiary);}
</style></head>
<body>
<div class="grid">
  <div class="tok"><div class="chip" style="background:var(--fill-brand)"></div><div class="k">--fill-brand</div><div class="v">blue-500</div></div>
  <div class="tok"><div class="chip" style="background:var(--fill-primary)"></div><div class="k">--fill-primary</div><div class="v">grey-900</div></div>
  <div class="tok"><div class="chip" style="background:var(--fill-secondary)"></div><div class="k">--fill-secondary</div><div class="v">grey-100</div></div>
  <div class="tok"><div class="chip" style="background:var(--fill-brand-weak)"></div><div class="k">--fill-brand-weak</div><div class="v">blue-50</div></div>
  <div class="tok"><div class="chip" style="background:var(--text-primary)"></div><div class="k">--text-primary</div><div class="v">grey-900</div></div>
  <div class="tok"><div class="chip" style="background:var(--text-secondary)"></div><div class="k">--text-secondary</div><div class="v">grey-700</div></div>
  <div class="tok"><div class="chip" style="background:var(--text-brand)"></div><div class="k">--text-brand</div><div class="v">blue-500</div></div>
  <div class="tok"><div class="chip" style="background:var(--surface-card);border:1.5px solid var(--border-primary)"></div><div class="k">--border-primary</div><div class="v">focus · blue-500</div></div>
</div>
</body></html>
