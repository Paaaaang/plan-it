<!-- @dsCard group="Type" viewport="700x150" name="Typeface · Pretendard" subtitle="OFL, commercially safe; metric-close Korean+Latin" -->
<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;padding:24px;background:var(--surface-card);font-family:var(--font-sans);color:var(--text-primary);}
  .big{font:700 40px/1.1 var(--font-sans);letter-spacing:-.02em;}
  .glyph{font:400 26px/1.3 var(--font-sans);color:var(--text-secondary);margin-top:10px;}
  .w{display:flex;gap:18px;margin-top:12px;}
  .w span{font-size:22px;}
</style></head>
<body>
  <div class="big">플랜잇 Planit 1234567890</div>
  <div class="glyph">가나다라마바사 ABCDEFG 0123 ₩ % — →</div>
  <div class="w">
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:500">Medium 500</span>
    <span style="font-weight:600">SemiBold 600</span>
    <span style="font-weight:700">Bold 700</span>
  </div>
</body></html>
